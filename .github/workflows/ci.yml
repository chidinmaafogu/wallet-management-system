name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

env:
  DB_POOL_SIZE: "5"
  DB_CONNECTION_TIMEOUT_MS: "10000"
  SERVER_PORT: "9090"
  WALLET_INSTITUTION_CODE: "000999"
  WALLET_INSTITUTION_NAME: 3Line Wallet
  WALLET_DEFAULT_CURRENCY: NGN
  WALLET_SYSTEM_FUNDING_ACCOUNT: "0000000000"
  WALLET_MIN_TRANSFER_AMOUNT: "0.01"
  WALLET_MAX_TRANSFER_AMOUNT: "1000000.00"
  WALLET_LOCK_TIMEOUT_MS: "5000"
  WALLET_SEED_DEMO_DATA: "false"

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wallet_test
          POSTGRES_USER: ${{ secrets.CI_DB_USERNAME || 'wallet' }}
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'ephemeral-ci-only' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run the test suite against PostgreSQL
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/wallet_test
          TEST_DB_USERNAME: ${{ secrets.CI_DB_USERNAME || 'wallet' }}
          TEST_DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'ephemeral-ci-only' }}
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Verify the application boots against PostgreSQL
        env:
          DB_URL: jdbc:postgresql://localhost:5432/wallet_test
          DB_USERNAME: ${{ secrets.CI_DB_USERNAME || 'wallet' }}
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'ephemeral-ci-only' }}
        run: |
          ./mvnw -B -q spring-boot:run &
          for i in $(seq 1 60); do
            curl -sf http://localhost:9090/actuator/health && break
            sleep 2
          done
          curl -sf http://localhost:9090/actuator/health | grep -q '"status":"UP"'
          kill %1

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
